<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ site.description }}" />

  <!-- The landing layout keeps its own head (it must not pull in the theme CSS),
       so the icons, canonical and analytics below are duplicated from _includes/head.html. -->
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
  <link rel="icon" href="{{ '/assets/images/favicon.svg?v=20260721' | relative_url }}" type="image/svg+xml" />
  <link rel="icon" href="{{ '/assets/images/favicon.png?v=20260721' | relative_url }}" type="image/png" />
  <link rel="shortcut icon" href="{{ '/assets/images/favicon.png?v=20260721' | relative_url }}" type="image/png" />
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png?v=20260721' | relative_url }}" />

  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
  <meta property="og:image" content="{{ page.image | default: site.social_image | prepend: site.baseurl | prepend: site.url }}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
  <meta name="twitter:description" content="{{ site.description }}" />
  <meta name="twitter:image" content="{{ page.image | default: site.social_image | prepend: site.baseurl | prepend: site.url }}" />
  {% if site.twitter_handle %}<meta name="twitter:site" content="{{ site.twitter_handle }}" />{% endif %}

  {% if jekyll.environment == "production" %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S7TGVXD4JT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-S7TGVXD4JT');
    </script>
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
  <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
</head>
<body>

  {% include marks.svg %}

  {% include site-header.html %}

  {{ content }}

  {% include site-footer.html %}

</body>
</html>
