  const colors = ['#E63946','#2A9D8F','#E9C46A','#264653','#F4A261','#8338EC','#06D6A0','#EF476F','#118AB2','#FFD166'];
  const searchInput = root.querySelector('.cab-search');
  const columnsEl = root.querySelector('.cab-columns');
  // Move tooltip to document.body so it's never clipped by ancestor overflow
  const tooltipEl = root.querySelector('.cab-tooltip');
  if (tooltipEl && tooltipEl.parentNode !== document.body) {
    document.body.appendChild(tooltipEl);
  }

  function escapeHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function positionTooltipAt(x, y) {
    const pad = 8;
    const offsetX = 14;
    const offsetY = 12;
    const ttW = 280; // keep in sync with CSS width

    let left = x + offsetX;
    let top = y + offsetY;

    // measure after display:block
    const ttH = tooltipEl.offsetHeight || 0;

    // If it overflows right edge, flip to left of cursor
    if (left + ttW > window.innerWidth - pad) {
      left = x - ttW - offsetX;
    }
    // Clamp horizontally
    left = Math.max(pad, Math.min(left, window.innerWidth - ttW - pad));

    // If it overflows bottom, move upward
    if (top + ttH > window.innerHeight - pad) {
      top = y - ttH - offsetY;
    }
    // Clamp vertically
    top = Math.max(pad, Math.min(top, window.innerHeight - ttH - pad));

    tooltipEl.style.left = left + 'px';
    tooltipEl.style.top = top + 'px';
  }

  function showTooltip(evt, html) {
    tooltipEl.innerHTML = html;
    tooltipEl.style.display = 'block';
    positionTooltipAt(evt.clientX, evt.clientY);
  }

  function hideTooltip() {
    tooltipEl.style.display = 'none';
  }

  // Determine coalitions present (sorted by id)
  const coalitionIds = [...new Set(actors.map(a => a.coalition))].sort((a, b) => a - b);

  const coalitionTitles = [
    'Skeptics & food quality critics',
    'Industry & market optimists',
    'Systemic transformation advocates'
  ];

  // Global max for bar scaling
  const maxStmts = Math.max(1, ...actors.map(a => a.stmts || 0));

  function render(query) {
    const q = (query || '').trim().toLowerCase();
    columnsEl.innerHTML = '';
    hideTooltip();

    coalitionIds.forEach(cid => {
      let members = actors
        .filter(a => a.coalition === cid)
        .sort((a, b) => (b.stmts || 0) - (a.stmts || 0) || a.name.localeCompare(b.name));

      const totalMembers = members.length;
      if (q) {
        members = members.filter(a => a.name.toLowerCase().includes(q));
      }

      const color = colors[cid % colors.length];

      const colEl = document.createElement('div');
      colEl.className = 'cab-col';
      colEl.style.borderTop = '3px solid ' + color;

      // Header
      const headerEl = document.createElement('div');
      headerEl.className = 'cab-col-header';
      headerEl.style.background = color + '0a';
      headerEl.innerHTML =
        (coalitionTitles[cid] != null ? coalitionTitles[cid] : 'Coalition ' + (cid + 1)) +
        '<span class="cab-col-count">' + (q ? members.length + '/' : '') + totalMembers + ' actors</span>';
      colEl.appendChild(headerEl);

      // Body
      const bodyEl = document.createElement('div');
      bodyEl.className = 'cab-col-body';

      if (!members.length) {
        bodyEl.innerHTML = '<div class="cab-empty">' + (q ? 'No matches' : 'No actors') + '</div>';
      } else {
        members.forEach(a => {
          const pct = maxStmts > 0 ? Math.round((a.stmts / maxStmts) * 100) : 0;

          let lines = [];
          a.supported.forEach(c => {
            lines.push('<div class="cab-tt-line"><span class="cab-tt-arrow cab-tt-supports">&#x25B2; Supports:</span> ' + escapeHtml(c) + '</div>');
          });
          a.opposed.forEach(c => {
            lines.push('<div class="cab-tt-line"><span class="cab-tt-arrow cab-tt-opposes">&#x25BC; Opposes:</span> ' + escapeHtml(c) + '</div>');
          });
          const ttContent = lines.length
            ? '<div class="cab-tt-heading">Positions:</div>' + lines.join('')
            : '<em>No stance details available</em>';

          const el = document.createElement('div');
          el.className = 'cab-actor';
          el.innerHTML =
            '<div class="cab-actor-name">' + escapeHtml(a.name) + '</div>' +
            '<div class="cab-bar-wrap">' +
              '<div class="cab-bar-track"><div class="cab-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
              '<span class="cab-bar-num">' + (a.stmts || 0) + '</span>' +
            '</div>' +
            '<div class="cab-actor-detail">' + a.activity + ' claim' + (a.activity !== 1 ? 's' : '') + '</div>';
          el.addEventListener('mouseenter', function(evt) { showTooltip(evt, ttContent); });
          el.addEventListener('mousemove', function(evt) { if (tooltipEl.style.display === 'block') positionTooltipAt(evt.clientX, evt.clientY); });
          el.addEventListener('mouseleave', hideTooltip);
          bodyEl.appendChild(el);
        });
      }

      colEl.appendChild(bodyEl);
      columnsEl.appendChild(colEl);
    });
  }
