{"supports": 8, "opposes": 0}}, "POL02": {"2019": {"supports": 34, "opposes": 58}, "2022": {"supports": 5, "opposes": 15}, "2021": {"supports": 12, "opposes": 17}, "2018": {"supports": 11, "opposes": 17}, "2025": {"supports": 25, "opposes": 19}, "2020": {"supports": 31, "opposes": 46}, "2016": {"supports": 10, "opposes": 1}, "2023": {"supports": 20, "opposes": 23}, "2017": {"supports": 7, "opposes": 4}, "2024": {"supports": 11, "opposes": 20}}, "POL07": {"2022": {"supports": 47, "opposes": 0}, "2021": {"supports": 58, "opposes": 2}, "2025": {"supports": 95, "opposes": 1}, "2019": {"supports": 94, "opposes": 5}, "2023": {"supports": 109, "opposes": 2}, "2024": {"supports": 94, "opposes": 1}, "2020": {"supports": 98, "opposes": 7}, "2018": {"supports": 65, "opposes": 3}, "2016": {"supports": 13, "opposes": 0}, "2017": {"supports": 14, "opposes": 1}, "2015": {"supports": 9, "opposes": 1}}, "POL08": {"2022": {"supports": 32, "opposes": 4}, "2020": {"supports": 25, "opposes": 1}, "2019": {"supports": 14, "opposes": 0}, "2025": {"supports": 17, "opposes": 1}, "2018": {"supports": 2, "opposes": 2}, "2024": {"supports": 14, "opposes": 2}, "2023": {"supports": 18, "opposes": 0}, "2021": {"supports": 16, "opposes": 3}, "2017": {"supports": 2, "opposes": 0}, "2016": {"supports": 2, "opposes": 0}, "2015": {"supports": 3, "opposes": 0}}};
  const claimLabels = {"PRD01": "Industrial animal agriculture causes unacceptable animal suf...", "PRD03": "Alternative proteins are better for the environment than con...", "PRD04": "Alternative proteins are healthier than conventional meat", "PRD05": "Alternative protein products are ultra-processed and not rea...", "PRD06": "Food technology can fundamentally transform the food system ...", "PRD07": "The alternative protein sector has strong market potential", "PRD08": "Animal agriculture is a growing financial and reputational r...", "PRD09": "Traditional food culture and meat heritage are valuable and ...", "POL01": "Cultivated meat should be approved under Novel Food Regulati...", "POL02": "Plant-based products should not be allowed to use meat-relat...", "POL03": "The EU should invest in and subsidize alternative protein re...", "POL04": "The EU should actively promote reduced meat consumption and ...", "POL05": "Ultra-processed foods, including some alternative proteins, ...", "POL06": "Governments should protect traditional farming livelihoods a...", "POL07": "Alternative protein products should have clear and transpare...", "POL08": "The EU should support domestic protein crop cultivation to r..."};
  const claimFullTexts = {"PRD01": "Industrial animal agriculture causes unacceptable animal suffering", "PRD03": "Alternative proteins are better for the environment than conventional animal products", "PRD04": "Alternative proteins are healthier than conventional meat", "PRD05": "Alternative protein products are ultra-processed and not real food", "PRD06": "Food technology can fundamentally transform the food system for the better", "PRD07": "The alternative protein sector has strong market potential", "PRD08": "Animal agriculture is a growing financial and reputational risk", "PRD09": "Traditional food culture and meat heritage are valuable and worth preserving", "POL01": "Cultivated meat should be approved under Novel Food Regulation", "POL02": "Plant-based products should not be allowed to use meat-related terminology", "POL03": "The EU should invest in and subsidize alternative protein research and production", "POL04": "The EU should actively promote reduced meat consumption and plant-based diets", "POL05": "Ultra-processed foods, including some alternative proteins, should be more strictly regulated", "POL06": "Governments should protect traditional farming livelihoods and the meat industry", "POL07": "Alternative protein products should have clear and transparent labeling", "POL08": "The EU should support domestic protein crop cultivation to reduce import dependency"};
  const claimShortNames = {"PRD01": "Animal Suffering", "PRD03": "Environment", "PRD04": "Health", "PRD05": "Ultra-processed", "PRD06": "Food Technology", "PRD07": "Market Potential", "PRD08": "Financial Risk", "PRD09": "Traditional Food Culture", "POL01": "Cultivated Meat", "POL02": "Meat-related Terminology", "POL03": "AP Subsidies", "POL04": "Dietary Promotion", "POL05": "Ultra-processed Foods", "POL06": "Traditional Farming Livelihoods", "POL07": "AP Labeling", "POL08": "Import Dependency"};
  const claimFamilies = {"PRD01": "product", "PRD03": "product", "PRD04": "product", "PRD05": "product", "PRD06": "product", "PRD07": "product", "PRD08": "product", "PRD09": "product", "POL01": "policy", "POL02": "policy", "POL03": "policy", "POL04": "policy", "POL05": "policy", "POL06": "policy", "POL07": "policy", "POL08": "policy"};
  const articlesPerYear = {"2024": 372, "2023": 626, "2021": 441, "2020": 290, "2022": 482, "2019": 407, "2017": 157, "2025": 355, "2016": 112, "2018": 247, "2015": 66};
  const normSel = root.querySelector('#claims-mentions-facets-norm');
  const gridEl = root.querySelector('.claims-mentions-facets-grid');
  const noteEl = root.querySelector('.chart-note');
  if (!gridEl || !noteEl || !normSel) return;

  function stripFamilyPrefix(name) {
    return name.replace(/^\[.*?\]\s*[-–—]?\s*/i, '');
  }

  // Group claim IDs by family, preserving order within each family
  const allIds = Object.keys(claimLabels);
  const byFamily = {};
  const familyOrder = [];
  allIds.forEach(id => {
    const fam = claimFamilies[id] || '';
    if (!byFamily[fam]) { byFamily[fam] = []; familyOrder.push(fam); }
    byFamily[fam].push(id);
  });
  // Build ordered list: family header marker + claim IDs
  const claimIds = [];
  const familyHeaders = {};  // index -> family name
  familyOrder.forEach(fam => {
    if (fam) familyHeaders[claimIds.length] = fam;
    byFamily[fam].forEach(id => claimIds.push(id));
  });
  if (!claimIds.length) {
    gridEl.innerHTML = '<p>No data</p>';
    return;
  }

  const columnCount = Math.max(1, Math.ceil(Math.sqrt(claimIds.length)));

  function computeSeries(claimId, normalize) {
    const yearData = allData[claimId];
    if (!yearData) return null;
    const years = Object.keys(yearData).sort();
    if (!years.length) return null;

    const fullRange = [];
    for (let year = parseInt(years[0], 10); year <= parseInt(years[years.length - 1], 10); year++) {
      fullRange.push(String(year));
    }

    function valueFor(year, label) {
      const raw = (yearData[year] && yearData[year][label]) || 0;
      if (!normalize) return raw;
      const nArticles = articlesPerYear[year] || 0;
      return nArticles > 0 ? Math.round((raw / nArticles) * 10000) / 100 : 0;
    }

    return {
      years: fullRange,
      supports: fullRange.map(year => valueFor(year, 'supports')),
      opposes: fullRange.map(year => valueFor(year, 'opposes')),
    };
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

    const normalize = normSel.value === 'norm';
    gridEl.innerHTML = '';
    noteEl.innerHTML = '';

    const noteItems = [];
    const seriesByClaim = {};
    let maxValue = 0;

    claimIds.forEach(claimId => {
      const series = computeSeries(claimId, normalize);
      seriesByClaim[claimId] = series;
      if (!series) return;
      series.supports.forEach(value => { if (value > maxValue) maxValue = value; });
      series.opposes.forEach(value => { if (value > maxValue) maxValue = value; });
    });

    const yMax = maxValue > 0 ? Math.ceil(maxValue * 1.05) : 1;

    claimIds.forEach((claimId, idx) => {
      if (familyHeaders[idx]) {
        const headerEl = document.createElement('div');
        headerEl.className = 'claims-mentions-family-header';
        headerEl.textContent = familyHeaders[idx];
        gridEl.appendChild(headerEl);
      }
      const shortName = (claimShortNames[claimId] || '').trim();
      const fullText = claimFullTexts[claimId] || claimLabels[claimId] || claimId;
      if (shortName) noteItems.push({ shortName, fullText });

      const facetEl = document.createElement('section');
      facetEl.className = 'claims-mentions-facet';

      const titleEl = document.createElement('div');
      titleEl.className = 'claims-mentions-facet-title';
      titleEl.textContent = shortName || fullText || claimId;
      titleEl.title = fullText || claimId;
      facetEl.appendChild(titleEl);

      const chartEl = document.createElement('div');
      chartEl.className = 'claims-mentions-facet-chart';
      facetEl.appendChild(chartEl);
      gridEl.appendChild(facetEl);

      const series = seriesByClaim[claimId];
      if (!series) {
        chartEl.innerHTML = '<p>No data</p>';
        return;
      }

      const traces = ['supports', 'opposes'].map(label => ({
        x: series.years,
        y: series[label],
        name: label.charAt(0).toUpperCase() + label.slice(1),
        type: 'scatter',
        mode: 'lines+markers',
        line: { color: colors[label], width: 2 },
        marker: { color: colors[label], size: 4 },
      }));

      window.Plotly.newPlot(chartEl, traces, {
        height: 170,
        margin: { l: 28, r: 4, t: 8, b: 38 },
        xaxis: {
          tickangle: 0,
          tickfont: { size: 10, color: '#777' },
          titlefont: { size: 10, color: '#777' },
        },
        yaxis: {
          title: normalize ? 'Per 100 articles' : 'Mentions',
          range: [0, yMax],
          tickfont: { size: 10, color: '#777' },
          titlefont: { size: 10, color: '#777' },
        },
        hovermode: 'x unified',
        showlegend: false,
      }, { displayModeBar: false, responsive: true });
    });

    noteEl.innerHTML = noteItems.length
      ? noteItems.map(item => `<strong>${escapeHtml(item.shortName)}</strong>: ${escapeHtml(item.fullText)}`).join(' &middot; ')
      : '';
  }

  ensurePlotlyLoaded(render);
})();
