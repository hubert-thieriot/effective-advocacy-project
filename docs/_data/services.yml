- title: "Actor Mapping"
  body: "Who's active on your issue and where they stand: decision-makers, stakeholders, and the coalitions forming between them."
- title: "Activity & Messaging"
  body: "What the key players are saying and doing — tracked across votes, speeches, consultation responses, media and social."
- title: "Ask Tracking"
  body: "Follow each ask through the process: where it's picked up, reworded, watered down, or dropped."
- title: "Live Monitoring"
  body: "Consultations, committees and agencies watched continuously, so no window, document or vote slips past."
